<style>
@font-face{font-family:Manrope;src:url(fonts/manrope-latin-500-normal.woff2) format('woff2');font-weight:500}
@font-face{font-family:Manrope;src:url(fonts/manrope-latin-800-normal.woff2) format('woff2');font-weight:800}

:root{
  --ink:#1A1A17; --ink2:#2E2E29; --gold:#E0A32E; --gold-d:#B0770F; --gold-t:#96640B;
  --cream:#FAF7F0; --cream-d:#EFE9DC; --soft:#5C5A52; --green:#3F7A46; --red:#B3402E;
  --e:cubic-bezier(.34,1.4,.5,1);   /* pop elastico */
  --s:cubic-bezier(.22,1,.36,1);    /* smorzato */
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:512px;height:512px;background:transparent}
body{font-family:Manrope,sans-serif;display:grid;place-items:center;overflow:hidden}

/* -------- telaio comune -------- */
.card{
  width:468px;height:468px;border-radius:112px;
  background:var(--cream);border:11px solid var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;position:relative;overflow:hidden;
  opacity:0;transform:scale(.8);
  animation:in .34s var(--e) forwards, out .3s var(--s) 2.3s forwards;
}
@keyframes in{to{opacity:1;transform:scale(1)}}
@keyframes out{to{opacity:0;transform:scale(.94)}}

.art{width:250px;height:220px;display:grid;place-items:center;position:relative}
.word{
  font-weight:800;font-size:46px;letter-spacing:.005em;color:var(--ink);
  text-transform:uppercase;text-align:center;line-height:1;
  opacity:0;transform:translateY(12px);
  animation:wordIn .4s var(--s) 1.02s forwards;
}
.word.sm{font-size:36px}
.word.xs{font-size:31px;line-height:1.12}
@keyframes wordIn{to{opacity:1;transform:none}}

/* -------- pezzi riusabili -------- */
.dot{position:absolute;border-radius:50%}
.rowbar{height:26px;border-radius:99px;background:var(--cream-d)}
</style></head><body>
